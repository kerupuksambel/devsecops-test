# SonarCloud (managed SonarQube). Placeholder organization and key.
sonar.organization=example
sonar.projectKey=example_devsecops-home-test
sonar.projectName=devsecops-home-test

sonar.sources=app
sonar.exclusions=app/**/*_test.go
sonar.tests=app
sonar.test.inclusions=app/**/*_test.go
sonar.go.coverage.reportPaths=app/coverage.out

# The quality gate itself is configured in SonarCloud: it fails on any new Blocker or
# Critical issue and on new code rated below A for security. The pipeline waits for it
# (sonar.qualitygate.wait=true) and fails when it fails.
